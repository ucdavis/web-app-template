name: Configure Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Azure environment to configure.
        required: true
        type: choice
        default: test
        options:
          - test
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    name: Configure ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      APP_NAME: ${{ vars.APP_NAME || 'webapp' }}
      # <deployment-settings:workflow-env>
      AUTH_CALLBACK_PATH: ${{ vars.AUTH_CALLBACK_PATH || '/signin-oidc' }}
      AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
      AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
      AUTH_INSTANCE: ${{ vars.AUTH_INSTANCE || 'https://login.microsoftonline.com/' }}
      AUTH_TENANT_ID: ${{ vars.AUTH_TENANT_ID }}
      NOTIFICATION_BASE_URL: ${{ vars.NOTIFICATION_BASE_URL }}
      NOTIFICATION_DEFAULT_APP_NAME: ${{ vars.NOTIFICATION_DEFAULT_APP_NAME }}
      NOTIFICATION_DEFAULT_BUTTON_TEXT: ${{ vars.NOTIFICATION_DEFAULT_BUTTON_TEXT }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL || 'http/protobuf' }}
      OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
      OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
      SMTP_BCC_EMAIL: ${{ vars.SMTP_BCC_EMAIL }}
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_REPLY_TO_EMAIL: ${{ vars.SMTP_REPLY_TO_EMAIL }}
      SMTP_TIMEOUT: ${{ vars.SMTP_TIMEOUT }}
      SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      # </deployment-settings:workflow-env>
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
      DEPLOY_ENV: ${{ inputs.environment }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN || 'sqladmin' }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
      SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME }}
      SQL_SKU_NAME: ${{ vars.SQL_SKU_NAME }}
      SQL_SKU_TIER: ${{ vars.SQL_SKU_TIER }}
      WEB_PLAN_NAME: ${{ vars.WEB_PLAN_NAME }}
      WEB_PLAN_RESOURCE_GROUP: ${{ vars.WEB_PLAN_RESOURCE_GROUP }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_ENV" != "test" && "$DEPLOY_ENV" != "prod" ]]; then
            echo "environment must be either test or prod."
            exit 1
          fi

          missing=()
          for name in APP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RESOURCE_GROUP SQL_ADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Environment configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          # <deployment-settings:workflow-required-checks>
          # No generated required deployment setting checks.
          # </deployment-settings:workflow-required-checks>

          if [[ -n "$WEB_PLAN_NAME" && -z "$WEB_PLAN_RESOURCE_GROUP" ]] ||
             [[ -z "$WEB_PLAN_NAME" && -n "$WEB_PLAN_RESOURCE_GROUP" ]]; then
            echo "WEB_PLAN_NAME and WEB_PLAN_RESOURCE_GROUP must either both be set or both be unset."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target resource group
        shell: bash
        run: |
          set -euo pipefail

          if ! az group show --name "$RESOURCE_GROUP" --output none; then
            echo "::error title=Azure resource group unavailable::Resource group '$RESOURCE_GROUP' does not exist in subscription '$AZURE_SUBSCRIPTION_ID' or the workflow identity cannot access it. Verify the RESOURCE_GROUP environment variable or rerun the subscription-scoped OIDC bootstrap."
            exit 1
          fi

      - name: Apply infrastructure
        id: configure
        shell: bash
        run: |
          set -euo pipefail

          deployment_name="${APP_NAME}-${DEPLOY_ENV}-config-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          params=(
            "appName=$APP_NAME"
            "env=$DEPLOY_ENV"
            "expectedSubscriptionId=$AZURE_SUBSCRIPTION_ID"
            "sqlAdminLogin=$SQL_ADMIN_LOGIN"
            "sqlAdminPassword=$SQL_ADMIN_PASSWORD"
          )

          add_param() {
            local name="$1"
            local value="$2"

            if [[ -n "$value" ]]; then
              params+=("$name=$value")
            fi
          }

          add_param "location" "$AZURE_LOCATION"
          add_param "sqlDatabaseName" "$SQL_DATABASE_NAME"
          add_param "sqlSkuName" "$SQL_SKU_NAME"
          add_param "sqlSkuTier" "$SQL_SKU_TIER"
          add_param "webPlanName" "$WEB_PLAN_NAME"
          add_param "webPlanResourceGroup" "$WEB_PLAN_RESOURCE_GROUP"

          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infrastructure/azure/main.bicep \
            --parameters "${params[@]}" \
            --query properties.outputs \
            --output json | tee deployment-outputs.json

          deployment_guard_passed="$(jq -r '.deploymentGuardPassed.value // false' deployment-outputs.json)"
          if [[ "$deployment_guard_passed" != "true" ]]; then
            echo "Azure deployment guard did not pass. Check subscription ID, resource group suffix, and environment values."
            exit 1
          fi

          web_app_name="$(jq -r '.webAppName.value // empty' deployment-outputs.json)"
          if [[ -z "$web_app_name" ]]; then
            echo "The configuration deployment did not return a webAppName output."
            exit 1
          fi

          echo "web_app_name=$web_app_name" >> "$GITHUB_OUTPUT"

      - name: Apply runtime app settings
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.configure.outputs.web_app_name }}
        run: |
          set -euo pipefail

          settings=(
            "ASPNETCORE_ENVIRONMENT=$DEPLOY_ENV"
            "WEBSITE_RUN_FROM_PACKAGE=1"
          )

          add_setting() {
            local name="$1"
            local value="$2"

            if [[ -n "$value" ]]; then
              settings+=("$name=$value")
            fi
          }

          add_setting "DB_CONNECTION" "$DB_CONNECTION"
          # <deployment-settings:workflow-runtime-settings>
          disabled_settings=(
          )

          if (( ${#disabled_settings[@]} > 0 )); then
            az webapp config appsettings delete \
              --resource-group "$RESOURCE_GROUP" \
              --name "$WEB_APP_NAME" \
              --setting-names "${disabled_settings[@]}" \
              --output none
          fi

          add_setting "Auth__CallbackPath" "$AUTH_CALLBACK_PATH"
          add_setting "Auth__ClientId" "$AUTH_CLIENT_ID"
          add_setting "Auth__Domain" "$AUTH_DOMAIN"
          add_setting "Auth__Instance" "$AUTH_INSTANCE"
          add_setting "Auth__TenantId" "$AUTH_TENANT_ID"
          add_setting "Notification__BaseUrl" "$NOTIFICATION_BASE_URL"
          add_setting "Notification__DefaultAppName" "$NOTIFICATION_DEFAULT_APP_NAME"
          add_setting "Notification__DefaultButtonText" "$NOTIFICATION_DEFAULT_BUTTON_TEXT"
          settings+=("OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT")
          add_setting "OTEL_EXPORTER_OTLP_HEADERS" "$OTEL_EXPORTER_OTLP_HEADERS"
          add_setting "OTEL_EXPORTER_OTLP_PROTOCOL" "$OTEL_EXPORTER_OTLP_PROTOCOL"
          add_setting "OTEL_RESOURCE_ATTRIBUTES" "$OTEL_RESOURCE_ATTRIBUTES"
          add_setting "OTEL_SERVICE_NAME" "$OTEL_SERVICE_NAME"
          add_setting "Smtp__BccEmail" "$SMTP_BCC_EMAIL"
          add_setting "Smtp__FromEmail" "$SMTP_FROM_EMAIL"
          add_setting "Smtp__FromName" "$SMTP_FROM_NAME"
          add_setting "Smtp__Host" "$SMTP_HOST"
          add_setting "Smtp__Password" "$SMTP_PASSWORD"
          add_setting "Smtp__Port" "$SMTP_PORT"
          add_setting "Smtp__ReplyToEmail" "$SMTP_REPLY_TO_EMAIL"
          add_setting "Smtp__Timeout" "$SMTP_TIMEOUT"
          add_setting "Smtp__UseSsl" "$SMTP_USE_SSL"
          add_setting "Smtp__Username" "$SMTP_USERNAME"
          # </deployment-settings:workflow-runtime-settings>

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --settings "${settings[@]}" \
            --output none

      - name: Wait for SCM restart
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.configure.outputs.web_app_name }}
        run: |
          set -euo pipefail

          scm_url="https://${WEB_APP_NAME}.scm.azurewebsites.net/api/settings"
          ready_count=0

          for attempt in {1..12}; do
            scm_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$scm_url" || true)"

            if [[ "$scm_status" == "200" || "$scm_status" == "401" ]]; then
              ((ready_count += 1))
              if (( ready_count == 2 )); then
                echo "Azure configuration is applied and SCM is ready."
                exit 0
              fi
            else
              ready_count=0
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "SCM did not recover after Azure configuration was applied."
          exit 1
