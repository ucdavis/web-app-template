name: Deploy Azure App Service

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and Azure deployment environment.
        required: true
        type: string
      app_name:
        description: Application tag used to find the existing App Service.
        required: false
        type: string
        default: webapp
      web_app_name:
        description: Existing App Service name. Defaults to tag-based discovery.
        required: false
        type: string
        default: ""
      resource_group:
        description: Azure resource group. Defaults to the RESOURCE_GROUP environment variable.
        required: false
        type: string
        default: ""
      dotnet_version:
        description: .NET SDK version to install.
        required: false
        type: string
        default: 10.0.x
      node_version:
        description: Node.js version to install.
        required: false
        type: string
        default: 22.x

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: azure-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max
    env:
      APP_NAME: ${{ vars.APP_NAME || inputs.app_name }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      DEPLOY_ENV: ${{ inputs.environment }}
      RESOURCE_GROUP: ${{ inputs.resource_group || vars.RESOURCE_GROUP }}
      WEB_APP_NAME_INPUT: ${{ inputs.web_app_name || vars.WEB_APP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_ENV" != "test" && "$DEPLOY_ENV" != "prod" ]]; then
            echo "environment must be either test or prod."
            exit 1
          fi

          missing=()
          for name in APP_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RESOURCE_GROUP; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Environment variable(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Restore frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Test frontend
        working-directory: client
        run: npm test -- --run

      - name: Restore .NET projects
        run: dotnet restore app.sln

      - name: Build .NET projects
        run: dotnet build app.sln --configuration Release --no-restore

      - name: Test .NET projects
        run: dotnet test app.sln --configuration Release --no-build

      - name: Publish app
        run: dotnet publish server/server.csproj --configuration Release --output "$PWD/publish/web"

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cd publish/web
          zip -qr ../webapp.zip .

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve existing App Service
        id: resolve_app
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$WEB_APP_NAME_INPUT" ]]; then
            web_app_name="$WEB_APP_NAME_INPUT"
            az webapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$web_app_name" \
              --output none
          else
            mapfile -t web_apps < <(
              az webapp list \
                --resource-group "$RESOURCE_GROUP" \
                --output json |
                jq -r --arg app "$APP_NAME" --arg env "$DEPLOY_ENV" \
                  '.[] | select(.tags.application == $app and .tags.environment == $env) | .name'
            )

            if (( ${#web_apps[@]} != 1 )); then
              echo "Expected one App Service tagged application=$APP_NAME and environment=$DEPLOY_ENV in $RESOURCE_GROUP; found ${#web_apps[@]}."
              exit 1
            fi

            web_app_name="${web_apps[0]}"
          fi

          echo "web_app_name=$web_app_name" >> "$GITHUB_OUTPUT"

      - name: Check SCM readiness
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.resolve_app.outputs.web_app_name }}
        run: |
          set -euo pipefail

          scm_url="https://${WEB_APP_NAME}.scm.azurewebsites.net/api/settings"
          ready_count=0

          for attempt in {1..12}; do
            scm_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$scm_url" || true)"

            if [[ "$scm_status" == "200" || "$scm_status" == "401" ]]; then
              ((ready_count += 1))
              if (( ready_count == 2 )); then
                echo "SCM is ready for package deployment."
                exit 0
              fi
            else
              ready_count=0
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "SCM is not ready for package deployment."
          exit 1

      - name: Deploy app package
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ steps.resolve_app.outputs.web_app_name }}
          package: publish/webapp.zip

      - name: Verify application health
        shell: bash
        env:
          WEB_APP_NAME: ${{ steps.resolve_app.outputs.web_app_name }}
        run: |
          set -euo pipefail

          app_url="https://${WEB_APP_NAME}.azurewebsites.net/health"
          ready_count=0

          for attempt in {1..12}; do
            app_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$app_url" || true)"

            if [[ "$app_status" == "200" ]]; then
              ((ready_count += 1))
              if (( ready_count == 2 )); then
                echo "The deployed application is healthy."
                exit 0
              fi
            else
              ready_count=0
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "The deployed application did not become healthy."
          exit 1
