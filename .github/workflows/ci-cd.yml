name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy.
        required: true
        type: choice
        default: test
        options:
          - test
          - prod

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Restore deployment tooling dependencies
        run: npm ci

      - name: Check deployment settings
        run: npm run deployment-settings:check

      - name: Check Bicep templates
        run: |
          az bicep build --file infrastructure/azure/main.bicep --stdout > /dev/null
          az bicep build --file infrastructure/azure/github-oidc.bicep --stdout > /dev/null

      - name: Restore frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Test frontend
        working-directory: client
        run: npm test -- --run

      - name: Restore .NET projects
        run: dotnet restore app.sln

      - name: Build .NET projects
        run: dotnet build app.sln --configuration Release --no-restore

      - name: Test .NET projects
        run: dotnet test app.sln --configuration Release --no-build

  deploy_test:
    name: Deploy test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-azure-appservice.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: test

  deploy_manual:
    name: Deploy ${{ inputs.environment }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/deploy-azure-appservice.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: ${{ inputs.environment }}
